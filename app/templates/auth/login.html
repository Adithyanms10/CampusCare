{% extends 'base.html' %}
{% from '_macros.html' import csrf %}
{% block guest %}
<div class="auth-card">
  <h1>Campus Care</h1>
  <p class="muted">Log in to submit or manage complaints.</p>
  <form method="post" class="form" data-loading>
    {{ csrf() }}
    <label>Email <input type="email" name="email" value="{{ form.get('email', '') }}" required autocomplete="email"></label>
    <label>Password <input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary" type="submit">Log in</button>
  </form>
  <p class="muted">New student? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</div>
{% endblock %}
